services:
  wordpress:
    image: ${WORDPRESS_IMAGE:-ghcr.io/onthebyway/wordpress:php8.5}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:?set WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:?set WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?set WORDPRESS_DB_PASSWORD}
      WP_HOME: ${SITE_URL:?set SITE_URL}
      WP_SITEURL: ${SITE_URL:?set SITE_URL}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
      PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-64M}
      PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-70M}
      PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-120}
      PHP_MAX_INPUT_VARS: ${PHP_MAX_INPUT_VARS:-3000}
      WP_MEMORY_LIMIT: ${WP_MEMORY_LIMIT:-256M}
      WP_MAX_MEMORY_LIMIT: ${WP_MAX_MEMORY_LIMIT:-512M}
      WP_DEBUG: ${WP_DEBUG:-false}
      WP_DEBUG_LOG: ${WP_DEBUG_LOG:-false}
      WP_DEBUG_DISPLAY: ${WP_DEBUG_DISPLAY:-false}
      WP_SCRIPT_DEBUG: ${WP_SCRIPT_DEBUG:-false}
      WP_DISALLOW_FILE_EDIT: ${WP_DISALLOW_FILE_EDIT:-true}
      WP_AUTO_UPDATE_CORE: ${WP_AUTO_UPDATE_CORE:-minor}
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-production}
      DISABLE_WP_CRON: ${DISABLE_WP_CRON:-true}
      WP_CRON_RUNNER_ENABLED: ${WP_CRON_RUNNER_ENABLED:-true}
      WP_CRON_INTERVAL_SECONDS: ${WP_CRON_INTERVAL_SECONDS:-300}
      WP_REDIS_HOST: redis
      WP_REDIS_PORT: 6379
      WP_REDIS_DATABASE: 0
      WP_REDIS_PREFIX: "${SITE_SLUG:?set SITE_SLUG}:"
      WP_REDIS_TIMEOUT: ${WP_REDIS_TIMEOUT:-1}
      WP_REDIS_READ_TIMEOUT: ${WP_REDIS_READ_TIMEOUT:-1}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-70M}
      NGINX_FASTCGI_CACHE_VALID: ${NGINX_FASTCGI_CACHE_VALID:-1h}
      NGINX_FASTCGI_CACHE_INACTIVE: ${NGINX_FASTCGI_CACHE_INACTIVE:-24h}
      NGINX_FASTCGI_CACHE_MAX_SIZE: ${NGINX_FASTCGI_CACHE_MAX_SIZE:-1g}
    volumes:
      - wordpress_data:/var/www/html
      - nginx_cache:/var/cache/nginx
    expose:
      - "8080"
    stop_grace_period: 30s

  database:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:?set WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER:?set WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?set WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-128mb}"
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 10s

volumes:
  wordpress_data:
  nginx_cache:
  database_data:
